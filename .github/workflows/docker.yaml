name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# 最小权限：本流程只需要读仓库代码
permissions:
  contents: read

# 同一分支不并发跑，避免两次推送互相抢磁盘/额度
concurrency:
  group: docker-mirror-${{ github.ref }}
  cancel-in-progress: false

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    # 增加可用磁盘空间（锁定到 v10，避免 @master 漂移带来的行为变化）
    - name: Maximize build space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 2048
        swap-size-mb: 128
        remove-dotnet: 'true'
        remove-haskell: 'true'
        # 如果空间还是不够用，可以把以下开启，清理出更多空间
        # remove-android: 'true'
        # remove-codeql: 'true'
        build-mount-path: '/var/lib/docker/'

    # 重启后等 daemon 真正可用再继续，避免 docker login 抢跑拿到 "Cannot connect to the Docker daemon"
    - name: Restart docker
      run: |
        sudo service docker restart
        for i in $(seq 1 20); do
          if docker info >/dev/null 2>&1; then
            echo "docker daemon 已就绪（第 ${i} 次探测）"
            break
          fi
          echo "等待 docker daemon ..."
          sleep 2
        done
        if ! docker info >/dev/null 2>&1; then
          echo "::error::docker daemon 启动失败，请检查 maximize-build-space 的 build-mount-path 是否与 runner 版本匹配"
          exit 1
        fi
        docker version

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout Code
      uses: actions/checkout@v4

    # 逐条转存：单个镜像失败不会中断整批，结果写入运行摘要
    - name: Build and push image Aliyun
      run: bash .github/scripts/push.sh
